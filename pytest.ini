[pytest]
# The doctests in ci_sdr/ and the tests import the BSS Eval reference
# tests/mir_eval_bss_eval.py as `mir_eval_bss_eval`. Not as `tests.…`: other
# packages (e.g. Gammatone, via paderbox) install a top-level `tests` package.
pythonpath = tests
addopts =
    --doctest-modules
    --doctest-continue-on-failure
    --cov=ci_sdr
    --cov-report=xml
    --cov-report=html
